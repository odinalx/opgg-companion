appId: io.odinalx.opggcompanion
productName: OPGG Companion
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
# Bibliothèque native de koffi (lecture de la touche Tab) : doit rester hors de l'archive asar.
asarUnpack:
  - node_modules/koffi/**
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
npmRebuild: false
