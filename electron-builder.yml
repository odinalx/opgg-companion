appId: io.odinalx.opggcompanion
productName: OPGG Companion
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  # koffi embarque ses binaires pour toutes les plateformes : seul win32_x64 sert.
  - '!node_modules/koffi/build/koffi/{darwin,linux,freebsd,openbsd,musl}*/**'
  - '!node_modules/koffi/build/koffi/win32_{arm64,ia32}/**'
  - '!node_modules/koffi/src/**'
asar: true
# Bibliothèque native de koffi (lecture de la touche Tab) : doit rester hors de l'archive asar.
asarUnpack:
  - node_modules/koffi/**
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: OPGG-Companion-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OPGG-Companion-Setup-${version}.${ext}
portable:
  artifactName: OPGG-Companion-Portable-${version}.${ext}
npmRebuild: false
